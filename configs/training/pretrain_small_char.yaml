# Character-level pretraining of the `small` preset (6 layers, 384-d, 256 context).
# The measured CPU run under benchmarks/training/char_small_cpu used batch 32 and 5000 steps.
name: pretrain-small-char
algorithm: pretrain
model_preset: small
data:
  kind: pretraining
  path: data/prepared/corpus
  tokenizer: auto
trainer:
  max_steps: 5000
  batch_size: 32
  eval_every: 500
  eval_batches: 200
  log_every: 100
  optimizer: {learning_rate: 3.0e-4, weight_decay: 0.1, beta1: 0.9, beta2: 0.95, grad_clip: 1.0}
  schedule: {name: cosine, warmup_steps: 100, decay_steps: 5000, min_lr: 3.0e-5}
  precision: {dtype: auto}
  checkpoint: {directory: checkpoints, save_every: 500, keep_last: 3}
output_dir: runs/pretrain-small-char
