manifest: configs/post_training/synthesis_ppo_qwen7b_lora.yaml
algorithm: ppo
backend: huggingface
base_model: Qwen/Qwen2.5-7B-Instruct
lora:
  r: 8
  alpha: 16
data:
  total: 500
  train: 400
  test: 100
  source: data/trajectories_real_ord.jsonl
config:
  num_iterations: 200
  batch_size: 4
  ppo_epochs: 3
  learning_rate: 1.0e-05
  kl_div_weight: 0.1
  clip_ratio: 0.2
ppo:
  ratio_level: sequence_mean
  kl_mode: monitor
  entropy_mode: sampled_logprob
  value_coef: 0.5
  entropy_coef: 0.01
optimizer: adam lr=1e-5
reward: synthesis rule reward on decoded JSON conditions
rollout:
  max_new_tokens: 128
  temperature: 0.7
