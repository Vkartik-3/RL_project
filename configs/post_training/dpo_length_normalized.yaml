# Length-normalised DPO (mean token log-prob), the configuration recorded under benchmarks/post_training/dpo.
name: dpo-length-normalized
algorithm: dpo
model_preset: tiny
model: {block_size: 64, dropout: 0.0}
data: {kind: preference, path: data/samples/preference/arithmetic_pairs.jsonl, tokenizer: char, max_length: 16}
trainer:
  max_steps: 40
  batch_size: 4
  eval_every: 0
  log_every: 10
  device: cpu
  optimizer: {learning_rate: 1.0e-5, weight_decay: 0.01, beta2: 0.999, decay_only_matrices: false}
  schedule: {name: constant, warmup_steps: 0}
  checkpoint: {directory: checkpoints, save_every: 0}
algorithm_params: {beta: 0.1, logprob_reduction: mean}
output_dir: runs/dpo-length-normalized
