name: ppo-tiny-cpu
algorithm: ppo
model_preset: tiny
model: {block_size: 64, dropout: 0.0}
data: {kind: verifiable, path: data/samples/verifiable/arithmetic_tasks.jsonl, tokenizer: char, max_length: 24}
reward: {type: rule, name: length, target_length: 12}
trainer:
  max_steps: 20
  batch_size: 4
  eval_every: 0
  log_every: 5
  device: cpu
  optimizer: {name: adam, learning_rate: 1.0e-4, weight_decay: 0.0, beta2: 0.999}
  schedule: {name: constant, warmup_steps: 0}
  checkpoint: {directory: checkpoints, save_every: 0}
algorithm_params:
  prompts_per_step: 4
  samples_per_prompt: 1
  ppo_epochs: 3
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  kl_coef: 0.1
  ratio_level: sequence_mean   # recorded configuration; `token` for per-token ratios
  kl_mode: monitor             # recorded configuration; `penalty` adds β·KL to the loss
  entropy_mode: sampled_logprob
  rollout: {max_new_tokens: 16, temperature: 0.7}
output_dir: runs/ppo-tiny-cpu
