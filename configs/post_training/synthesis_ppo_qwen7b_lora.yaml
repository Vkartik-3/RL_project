# Value-head PPO on generated synthesis conditions (GPU). Recorded under benchmarks/post_training/ppo_synthesis.
name: synthesis-ppo-qwen7b-lora
algorithm: ppo
backend: {type: huggingface, model_name: Qwen/Qwen2.5-7B-Instruct, lora_r: 8, lora_alpha: 16, torch_dtype: float16}
data: {kind: trajectories, path: data/samples/synthesis/trajectories_literature.jsonl}
reward: {type: synthesis_rule}
trainer:
  max_steps: 200
  batch_size: 4
  eval_every: 0
  log_every: 10
  device: cuda
  optimizer: {name: adam, learning_rate: 1.0e-5, weight_decay: 0.0, beta2: 0.999}
  schedule: {name: constant, warmup_steps: 0}
  precision: {dtype: float16}
  checkpoint: {directory: checkpoints, save_every: 50}
algorithm_params:
  prompts_per_step: 4
  samples_per_prompt: 1
  ppo_epochs: 3
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  kl_coef: 0.1
  ratio_level: sequence_mean
  kl_mode: monitor
  entropy_mode: sampled_logprob
  rollout: {max_new_tokens: 128, temperature: 0.7, max_prompt_length: 512}
output_dir: runs/synthesis-ppo-qwen7b-lora
