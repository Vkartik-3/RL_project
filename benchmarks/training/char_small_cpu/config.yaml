manifest: configs/training/pretrain_small_char.yaml
model_preset: small
model:
  n_layer: 6
  n_head: 6
  n_kv_head: 6
  n_embd: 384
  block_size: 256
  dropout: 0.1
  vocab_size: 65
trainer:
  batch_size: 32
  max_steps: 5000
  optimizer: adamw lr=3e-4 wd=0.1 betas=(0.9,0.95) grad_clip=1.0
  schedule: cosine warmup=100 decay_steps=5000 min_lr=3e-5
  precision: float32
