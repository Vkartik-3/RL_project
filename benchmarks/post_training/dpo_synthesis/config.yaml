manifest: configs/post_training/synthesis_dpo_qwen7b_lora.yaml
algorithm: dpo
backend: huggingface
base_model: Qwen/Qwen2.5-7B-Instruct
init: SFT adapter
beta: 0.1
logprob_reduction: mean
reference: base model with LoRA disabled
optimizer: adamw lr=1e-5 (torch default wd=0.01)
batch_size: 4
pairs: build_preference_pairs(pairs_per_molecule=20) on the first 400 literature records
precision: fp16 + GradScaler
