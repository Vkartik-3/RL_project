name: dapo-tiny-cpu
algorithm: dapo
model_preset: tiny
model: {block_size: 64, dropout: 0.0}
data: {kind: verifiable, path: data/samples/verifiable/arithmetic_tasks.jsonl, tokenizer: char, max_length: 24}
reward: {type: rule, name: length, target_length: 12}
trainer:
  max_steps: 20
  batch_size: 4
  eval_every: 10
  log_every: 5
  device: cpu
  optimizer: {learning_rate: 5.0e-5, weight_decay: 0.0, beta2: 0.999}
  schedule: {name: constant, warmup_steps: 0}
  checkpoint: {directory: checkpoints, save_every: 0}
algorithm_params:
  group_size: 4
  prompts_per_step: 2
  clip_eps_low: 0.2
  clip_eps_high: 0.28
  kl_coef: 0.04
  entropy_coef: 0.001
  dynamic_sampling: true
  overlong_penalty: -1.0
  rollout: {max_new_tokens: 16, temperature: 0.9}
output_dir: runs/dapo-tiny-cpu
