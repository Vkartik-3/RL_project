# GRPO with rollout generation and reward scoring in Ray worker actors (CPU, local Ray instance).
# Requires: pip install -e '.[ray]'. The learner (optimizer, gradients) stays in the driver process.
name: grpo-ray-tiny-cpu
algorithm: grpo
model_preset: tiny
model: {block_size: 64, dropout: 0.0}
data: {kind: verifiable, path: data/samples/verifiable/arithmetic_tasks.jsonl, tokenizer: char, max_length: 24}
reward: {type: verifier, verifier: math, target_key: answer}
orchestration:
  type: ray
  num_cpus: 4              # size of the private local Ray instance; remove and set address: auto to join a cluster
  rollout_workers: 2
  reward_workers: 2
  cpus_per_worker: 1
  placement_strategy: PACK
  max_restarts: 1
  max_call_retries: 2
trainer:
  max_steps: 10
  batch_size: 4
  eval_every: 5
  log_every: 1
  device: cpu
  optimizer: {learning_rate: 5.0e-5, weight_decay: 0.01, beta2: 0.999, decay_only_matrices: false}
  schedule: {name: constant, warmup_steps: 0}
  checkpoint: {directory: checkpoints, save_every: 0}
algorithm_params:
  group_size: 4
  prompts_per_step: 2
  clip_ratio: 0.2
  kl_coef: 0.04
  objective: clipped
  ratio_level: sequence_mean
  rollout: {max_new_tokens: 16, temperature: 0.9}
output_dir: runs/grpo-ray-tiny-cpu
